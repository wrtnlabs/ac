[package]
name = "ac-mcp"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Streamable-HTTP client transport (remote servers). Off by default: it pulls
# an HTTP client + TLS stack that stdio-only hosts should not pay for.
http = [
    "dep:base64",
    "dep:http",
    "dep:reqwest",
    "dep:sha2",
    "dep:tokio-util",
    "dep:uuid",
    "rmcp/transport-streamable-http-client-reqwest",
    "rmcp/reqwest",
]
# Standard config/catalog/credential/lifecycle assembly. It currently
# includes remote OAuth support, while keeping low-level HTTP consumers free
# of the control-plane and tool-search dependencies.
managed = [
    "http",
    "dep:ac-tools",
    "dep:indexmap",
    "dep:windows-sys",
]

[dependencies]
ac-tool.workspace = true
ac-tools = { workspace = true, optional = true }
ac-types.workspace = true
base64 = { workspace = true, optional = true }
futures.workspace = true
# Not workspace-listed: only this crate needs it, only under `http`, and the
# major must track rmcp's own `http` dependency.
http = { version = "1", optional = true }
indexmap = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rmcp = { workspace = true, features = [
    "client",
    "transport-async-rw",
    "transport-io",
    "transport-child-process",
] }
serde.workspace = true
serde_json.workspace = true
# Only the opt-in OAuth/HTTP path needs PKCE S256.
sha2 = { version = "0.10", optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }

[dev-dependencies]
ac-provider.workspace = true
ac-provider-mock.workspace = true
ac-runtime.workspace = true
rmcp = { workspace = true, features = ["server"] }
tempfile.workspace = true
